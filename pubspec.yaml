name: doublevpartners
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  convex_bottom_bar: ^3.2.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_localization: ^0.3.3
  flutter_native_splash: ^2.3.10
  get: ^4.7.2
  image_picker: ^1.1.1
  intl: ^0.20.2
  ionicons: ^0.2.2
  logger: ^2.6.2
  lottie: ^3.1.0
  path_provider: ^2.1.5
  pdf: ^3.6.0
  photo_view: ^0.15.0
  sembast: ^3.8.5+1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.10

flutter_icons:
  image_path_android: "assets/icon/icon_android.png"
  image_path_ios: "assets/icon/icon_ios.png"
  android: true
  ios: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/background-splash.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - fonts/raleway/
    - fonts/Roboto/
    - fonts/sf-compact/

  fonts:
    - family: Raleway
      fonts:
        - asset: fonts/raleway/Raleway-Regular.ttf
        - asset: fonts/raleway/Raleway-Italic.ttf
          style: italic

    - family: sf-compact
      fonts:
        - asset: fonts/SF-Compact-Display-Regular.ttf
          weight: 700

    - family: Roboto
      fonts:
        - asset: fonts/Roboto/Roboto-Regular.ttf
        - asset: fonts/Roboto/Roboto-Italic.ttf
          style: italic
